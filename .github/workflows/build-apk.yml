# Build & sign the Android APK and attach it to a GitHub release.
#
# Triggers:
#   - Every push to `main`         → rebuilds APK + updates the rolling
#                                    `latest` release (one slot, overwrites)
#   - Version tag push (vX.Y.Z)    → builds APK + creates a permanent
#                                    versioned release with auto-generated
#                                    release notes
#   - Manual run (Actions tab)     → same as a push to main
#
# Docs-only commits (README / docs/ / *.md / LICENSE) are skipped so we
# don't burn CI minutes on a typo fix.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    The keystore file, base64-encoded.
#                               $ base64 -i my-release-key.jks | pbcopy
#   ANDROID_KEYSTORE_PASSWORD  The keystore password.
#   ANDROID_KEY_ALIAS          The key alias inside the keystore.
#   ANDROID_KEY_PASSWORD       The password for that key (often the same as
#                               the keystore password — depends on how you
#                               created it).
#
# See .github/SECRETS_SETUP.md for the one-time keystore-and-secrets setup.

name: Build & release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed for the release-upload step

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - run: sudo apt-get update -qq && sudo apt-get install -y imagemagick

      - name: Install npm dependencies
        run: npm ci

      - name: Build www/ and add android/
        run: |
          npx cap add android
          npm run build           # also patches AndroidManifest with CAMERA
          npx cap sync android

      - name: Generate launcher icons from icons/icon-source.png
        run: |
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for d in "${!SIZES[@]}"; do
            sz=${SIZES[$d]}
            dir="android/app/src/main/res/mipmap-$d"
            mkdir -p "$dir"
            convert icons/icon-source.png -resize ${sz}x${sz} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          # Drop the adaptive-icon XMLs so the legacy PNG above is used on
          # Android 8+ as well (avoids weird circle/squircle cropping of the
          # rounded-square icon — the icon already includes its own corners).
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/release.keystore

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Zipalign + sign APK
        env:
          KS_PWD:    ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PWD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"

          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app-release-aligned.apk"
          SIGNED="vault-wallet.apk"

          if [ ! -f "$UNSIGNED" ]; then
            # Some Capacitor versions output app-release.apk directly when no
            # signing config is in build.gradle. Handle either filename.
            UNSIGNED="android/app/build/outputs/apk/release/app-release.apk"
          fi
          if [ ! -f "$UNSIGNED" ]; then
            echo "::error::Could not find the gradle output APK"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks android/app/release.keystore \
            --ks-pass "pass:$KS_PWD" \
            --key-pass "pass:$KEY_PWD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$SIGNED" \
            "$ALIGNED"
          "$APKSIGNER" verify --print-certs "$SIGNED"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-wallet-apk
          path: vault-wallet.apk
          retention-days: 30

      # Tag push (vX.Y.Z) — create a permanent versioned release
      - name: Attach APK to versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vault-wallet.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Push to main or manual run — overwrite the rolling `latest` release
      # so /releases/latest always serves the newest APK.
      - name: Update rolling `latest` release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (auto)
          body: |
            🤖 Auto-built from `main` on every push.

            **Commit:** `${{ github.sha }}`
            **Build:**  #${{ github.run_number }}
            **Built:**  ${{ github.event.head_commit.timestamp || github.run_started_at }}

            Download **`vault-wallet.apk`** below and sideload to your Android device.

            ⚠️ If you have an older Vault installed signed with a **different** keystore, Android will refuse to install over it — uninstall the old one first.
          files: vault-wallet.apk
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
